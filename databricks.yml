bundle:
  name: the_lake_house

include:
  - resources/*.yml
  
variables:
  catalog:
    description: Unity Catalog catalog
    default: workspace

  schema:
    description: Unity Catalog schema
    default: default

  s3_base_path:
    description: S3 path used for Snowflake handoff files
    default: s3://lucien-racine-aws-bucket/raw/databricks

  secret_scope:
    description: Databricks secret scope
    default: lakehouse

  snowflake_stage:
    description: Snowflake external stage
    default: RAW_S3_STAGE

targets:
  dev:
    default: true
    mode: development

    workspace:
      host: https://dbc-c9b4b6e0-7d8b.cloud.databricks.com